name: Ansible checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ansible-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: python -m pip install --upgrade ansible ansible-lint

      - name: Syntax check
        env:
          ANSIBLE_STDOUT_CALLBACK: default
        run: ansible-playbook playbooks/setup-mailserver.yml --syntax-check

      - name: Minimal Ansible lint
        env:
          ANSIBLE_STDOUT_CALLBACK: default
        run: ansible-lint --profile min
