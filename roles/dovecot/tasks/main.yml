- name: Install Dovecot
  dnf:
    name:
      - dovecot
      - dovecot-pigeonhole
    state: present

- name: Configure mail location
  lineinfile:
    path: /etc/dovecot/conf.d/10-mail.conf
    regexp: '^mail_location ='
    line: 'mail_location = {{ dovecot_mail_location }}'

- name: Configure auth username format
  blockinfile:
    path: /etc/dovecot/conf.d/10-auth.conf
    block: |
      auth_username_format = %n
    marker: "# {mark} ANSIBLE MANAGED BLOCK - AUTH CONFIG"
  notify: Restart Dovecot

- name: Check Dovecot password file
  stat:
    path: /etc/dovecot/users
  register: dovecot_users_file

- name: Require a separate mail password hash for initial migration
  assert:
    that:
      - dovecot_users_file.stat.exists or (dovecot_mail_password_hash | default('') | length > 0)
    fail_msg: >-
      /etc/dovecot/users does not exist. Generate a Dovecot password hash with
      'doveadm pw -s BLF-CRYPT' and provide it as dovecot_mail_password_hash
      through an external Ansible Vault/extra-vars file.
  no_log: true

- name: Install Dovecot mail password file
  copy:
    dest: /etc/dovecot/users
    owner: root
    group: dovecot
    mode: '0640'
    content: |
      ole:{{ dovecot_mail_password_hash }}
  when: (dovecot_mail_password_hash | default('') | length) > 0
  no_log: true
  notify: Restart Dovecot

- name: Protect Dovecot mail password file
  file:
    path: /etc/dovecot/users
    owner: root
    group: dovecot
    mode: '0640'

- name: Disable PAM password authentication
  lineinfile:
    path: /etc/dovecot/conf.d/10-auth.conf
    regexp: '^#?!include\s+auth-system\.conf\.ext\s*$'
    line: '#!include auth-system.conf.ext'
  notify: Restart Dovecot

- name: Configure separate Dovecot mail authentication
  copy:
    dest: /etc/dovecot/conf.d/99-ansible-auth.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible - do not edit manually
      passdb {
        driver = passwd-file
        args = username_format=%n /etc/dovecot/users
      }

      userdb {
        driver = passwd
      }
  notify: Restart Dovecot

- name: Restrict Dovecot protocols and listeners
  copy:
    dest: /etc/dovecot/conf.d/99-ansible-protocols.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible - do not edit manually
      protocols = imap lmtp

      service imap-login {
        inet_listener imap {
          port = 0
        }

        inet_listener imaps {
          port = 993
          ssl = yes
        }
      }
  notify: Restart Dovecot

- name: Configure SSL certs
  blockinfile:
    path: /etc/dovecot/conf.d/10-ssl.conf
    block: |
      ssl = required
      ssl_cert = <{{ dovecot_ssl_cert }}
      ssl_key  = <{{ dovecot_ssl_key }}
    marker: "# {mark} ANSIBLE MANAGED BLOCK - SSL CONFIG"
  notify: Restart Dovecot

- name: Expose Dovecot auth socket for Postfix
  blockinfile:
    path: /etc/dovecot/conf.d/10-master.conf
    block: |
      service auth {
        unix_listener auth-userdb {
          mode = 0600
          user = dovecot
          group = dovecot
        }

        # Postfix smtp-auth
        unix_listener /var/spool/postfix/private/auth {
          mode = 0660
          user = dovecot
          group = postfix
        }
      }
    marker: "# {mark} ANSIBLE MANAGED BLOCK - AUTH SOCKET"
  notify: Restart Dovecot

- name: Enable LMTP service for Postfix in Dovecot
  blockinfile:
    path: /etc/dovecot/conf.d/10-master.conf
    block: |
      service lmtp {
        unix_listener /var/spool/postfix/private/dovecot-lmtp {
          mode = 0600
          user = postfix
          group = postfix
        }
      }
    marker: "# {mark} ANSIBLE MANAGED BLOCK - LMTP for Postfix"
  notify: Restart Dovecot

- name: Ensure Maildir exists for system users
  command: "doveadm mailbox create -u {{ item }} INBOX"
  become: true
  become_user: "{{ item }}"
  loop:
    - ole
    # - kia
    # - arthur
  args:
    creates: "/home/{{ item }}/Maildir"

- name: Validate Dovecot configuration
  command: doveconf -n
  changed_when: false

- name: Ensure Dovecot is running and enabled
  service:
    name: dovecot
    state: started
    enabled: true
