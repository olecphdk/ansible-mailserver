- name: Install firewalld and fail2ban
  dnf:
    name:
      - firewalld
      - fail2ban
    state: present

- name: Enable and start firewalld
  service:
    name: firewalld
    state: started
    enabled: true

- name: Allow required ports in firewalld
  firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    state: enabled
    immediate: yes
  loop: "{{ open_ports | default([22,25,80,587,993]) }}"

- name: Configure fail2ban jails for SSH, Postfix and Dovecot
  copy:
    dest: /etc/fail2ban/jail.d/slushice.conf
    content: |
      [DEFAULT]
      bantime = {{ fail2ban_bantime }}
      findtime = {{ fail2ban_findtime }}
      maxretry = {{ fail2ban_maxretry }}

      [sshd]
      enabled = true
      port    = ssh
      backend = systemd

      [postfix]
      enabled = true
      port    = smtp,ssmtp,submission
      backend = systemd

      [postfix-sasl]
      enabled = true
      port    = smtp,ssmtp,submission
      backend = systemd

      [dovecot]
      enabled = true
      port    = pop3,pop3s,imap,imaps,submission,465,sieve
      backend = systemd
  notify: Restart fail2ban

- name: Ensure fail2ban is running
  service:
    name: fail2ban
    state: started
    enabled: true
