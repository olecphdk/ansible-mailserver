- name: Install certbot
  dnf:
    name: certbot
    state: present

- name: Obtain LE cert via standalone
  command: >
    certbot certonly --standalone --agree-tos --non-interactive
    --email {{ letsencrypt_email }}
    --cert-name {{ tls_cert_name }}
    --domains {{ letsencrypt_domains | join(',') }}
  args:
    creates: "/etc/letsencrypt/live/{{ tls_cert_name }}/fullchain.pem"
  notify:
    - Reload Postfix
    - Reload Dovecot

- name: Deploy hook for renewals
  copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-mail.sh
    mode: '0755'
    content: |
      #!/bin/sh
      systemctl reload postfix || true
      systemctl reload dovecot || true
